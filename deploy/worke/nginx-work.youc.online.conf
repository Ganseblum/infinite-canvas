# work.youc.online —— AI 办公助理用户端（app 静态站 + api 反代）
# 首次先以 HTTP 上线，certbot --nginx 签发后自动补 443 段。
server {
    listen 80;
    server_name work.youc.online;

    client_max_body_size 50m;

    # API（含 SSE 流）：不过缓冲、长超时，直连 api 容器回环端口。
    location /api/ {
        proxy_pass http://127.0.0.1:3302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 主站静态（容器内 nginx 处理 SPA 回退与运行时配置注入）。
    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
