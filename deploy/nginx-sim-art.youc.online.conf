# 测试环境前端站点（宿主机 Nginx → 127.0.0.1:3100，即 compose 里的 app 容器）。
#
# 安装步骤：
#   1. 本文件先原样复制到 /etc/nginx/sites-available/sim-art.youc.online，再软链到
#      sites-enabled/。此处只配 HTTP，因为此时证书还不存在；直接写 TLS 段会让
#      nginx -t 因找不到证书文件而失败。
#   2. nginx -t && systemctl reload nginx
#   3. certbot --nginx --redirect -d sim-art.youc.online
#      certbot 会补上 listen 443 的 TLS 段与 80 → 443 跳转（带 "managed by Certbot" 注释）。
#      不要手工写 TLS 段，否则续期时 certbot 不认。
#
# 每一项的由来（配错很难查，别随手改）：
#   - /api/ai/chat/completions 是 SSE，proxy_buffering / proxy_request_buffering / gzip
#     必须全关。app 容器内的 nginx 已经关了一层，宿主机这层不关，流式响应照样会被缓冲住。
#   - 图片与视频上传要穿过宿主机 nginx 和容器内 nginx 两层，client_max_body_size 给到 500m
#     （容器内对 /api/media/ 放行 200m）。
#   - 生成与视频轮询可能持续很久，读写超时放宽到 600s。
#   - 后端 COOKIE_SECURE=true，登录态依赖 X-Forwarded-Proto 正确传递。
#   - 不设置 $connection_upgrade：本应用走 SSE 不走 WebSocket。那个 map 目前定义在
#     /etc/nginx/conf.d/sub2api-http.conf 里，属于另一个项目的配置，本站点不应依赖它。
#
# 正式环境同构：把 server_name 换成正式域名、proxy_pass 端口换成 3200（APP_PORT）即可。

server {
    server_name sim-art.youc.online;

    client_header_timeout 10s;
    client_max_body_size 500m;
    large_client_header_buffers 4 16k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    gzip off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
    }

    listen 80;
    listen [::]:80;
}
