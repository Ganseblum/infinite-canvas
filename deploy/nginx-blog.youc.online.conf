# 博客前台站点（宿主机 Nginx → 127.0.0.1:3101，即 compose 里的 blog-web 容器）。
#
# 安装步骤（与 sim-art 站点同流程）：
#   1. 复制到 /etc/nginx/sites-available/blog.youc.online 并软链到 sites-enabled/
#   2. nginx -t && systemctl reload nginx
#   3. certbot --nginx --redirect -d blog.youc.online
#
# 每一项的由来：
#   - 页面是 ISR 缓存渲染，proxy_buffering 保持开启没问题；互动 API 是普通短请求。
#   - /_next/static 与 /assets/* 带内容指纹，长缓存交给浏览器；HTML 不缓存（后台改完即时生效）。
#   - /api/v1/blog/* 同域代理到 blog-web（blog-web 再转内网 Go）：登录态 cookie 落 blog 子域。
#   - 博客无大文件上传，client_max_body_size 2m 足够。

server {
    server_name blog.youc.online;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 带指纹的静态资源：一年强缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3101;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:3101;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 互动 API：同域转发（blog-web 内部 rewrite 到内网 Go）
    location /api/v1/blog/ {
        proxy_pass http://127.0.0.1:3101;
    }

    # 其余（HTML 页面 / feed / sitemap / robots）：不缓存
    location / {
        proxy_pass http://127.0.0.1:3101;
    }
}
