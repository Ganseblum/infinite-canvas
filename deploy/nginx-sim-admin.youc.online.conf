# 测试环境管理后台站点（宿主机 Nginx → 127.0.0.1:3101，即 compose 里的 admin 容器）。
#
# 安装步骤：
#   1. 本文件先原样复制到 /etc/nginx/sites-available/sim-admin.youc.online，再软链到
#      sites-enabled/。此处只配 HTTP，因为此时证书还不存在；直接写 TLS 段会让
#      nginx -t 因找不到证书文件而失败。
#   2. nginx -t && systemctl reload nginx
#   3. certbot --nginx --redirect -d sim-admin.youc.online
#      certbot 会补上 listen 443 的 TLS 段与 80 → 443 跳转（带 "managed by Certbot" 注释）。
#      不要手工写 TLS 段，否则续期时 certbot 不认。
#
# 与主站站点（nginx-sim-art.youc.online.conf）的差异，别照抄主站那份：
#   - 本文件没有任何 /api 反代：admin 跨域直连主站 API（ADMIN_API_BASE_URL），这个域下不存在 API。
#     少了 SSE 与媒体上传，所以主站那份的 proxy_buffering / proxy_request_buffering / gzip off
#     和 600s 读写超时都不需要。
#   - client_max_body_size 只给 1m：管理后台页面上传不了文件，请求体只有登录、筛选这类小 JSON。
#   - 后台入口不应出现在搜索引擎结果里，统一加 X-Robots-Tag: noindex（admin 的 index.html 里也有 meta robots）。
#   - 后端 COOKIE_SECURE=true，登录态依赖 X-Forwarded-Proto 正确传递，四个 proxy 头与主站保持一致。
#
# 正式环境同构：把 server_name 换成正式域名、proxy_pass 端口换成 3201（ADMIN_PORT）即可。

server {
    server_name sim-admin.youc.online;

    client_header_timeout 10s;
    client_max_body_size 1m;
    large_client_header_buffers 4 16k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # always 保证错误响应（4xx/5xx）也带上，避免异常页被收录。
    add_header X-Robots-Tag "noindex" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
    }

    listen 80;
    listen [::]:80;
}
