                bonusMicros: { type: integer, format: int64 }
                enabled: { type: boolean, default: true }
                sort: { type: integer, default: 0 }
      responses:
        '201':
          description: 档位
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPackageItem' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/admin/credit-packages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Admin-订单]
      summary: 更新充值档位（packages.write；无删除入口）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                priceMicros: { type: integer, format: int64 }
                bonusMicros: { type: integer, format: int64 }
                enabled: { type: boolean }
                sort: { type: integer }
      responses:
        '200':
          description: 档位
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPackageItem' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/orders:
    get:
      tags: [Admin-订单]
      summary: 全站订单查询（orders.read）
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/SizeParam' }
        - { name: sort, in: query, schema: { type: string }, description: '白名单 createdAt|priceMicros，默认 -createdAt' }
        - { name: status, in: query, schema: { type: string, enum: [pending, paid, failed, refunded] } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 订单分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/OrderPayload'
                        - type: object
                          properties:
                            userId: { type: string, format: uuid }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  size: { type: integer }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/requests/refunds/retry:
    post:
      tags: [Admin-订单]
      summary: 重试全部退款失败的生成请求（orders.refund）
      responses:
        '200':
          description: 重试条数
          content:
            application/json:
              schema:
                type: object
                properties:
                  retried: { type: integer }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/channels:
    get:
      tags: [Admin-渠道]
      summary: 上游渠道列表（channels.read，Key 只写不读）
      responses:
        '200':
          description: 渠道列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ChannelItem' } }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Admin-渠道]
      summary: 新建渠道（channels.write，API Key 加密落库）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, baseUrl, apiFormat, apiKey]
              properties:
                name: { type: string }
                baseUrl: { type: string }
                apiFormat: { type: string, enum: [openai, gemini, ark] }
                apiKey: { type: string, description: 只写不读 }
                priority: { type: integer, default: 0 }
                enabled: { type: boolean, default: true }
      responses:
        '201':
          description: 渠道
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelItem' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/admin/channels/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Admin-渠道]
      summary: 更新渠道（channels.write；传 apiKey 才换 Key，空白保留原值）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                baseUrl: { type: string }
                apiFormat: { type: string, enum: [openai, gemini, ark] }
                apiKey: { type: string, description: 只写不读 }
                priority: { type: integer }
                enabled: { type: boolean }
      responses:
        '200':
          description: 渠道
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelItem' }
        '404': { $ref: '#/components/responses/Error404' }
    delete:
      tags: [Admin-渠道]
      summary: 删除渠道（channels.write；仍被模型引用则 400）
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/membership/subscriptions:
    get:
      tags: [Admin-会员]
      summary: 会员订阅列表（membership.read）
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/SizeParam' }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: planId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, ended] } }
      responses:
        '200':
          description: 订阅分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SubscriptionItem' } }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  size: { type: integer }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/membership/grant:
    post:
      tags: [Admin-会员]
      summary: 发放/续期会员（membership.write，不走过单）
      description: 从 max(当前 period_end, now) 起叠加一个档位周期并回写存储配额；补偿发放走 /membership/compensate（同一实现，审计动作不同）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, planId, reason]
              properties:
                userId: { type: string, format: uuid }
                planId: { type: string, description: 须为可购买档位，时长由档位 durationDays 决定 }
                reason: { type: string }
      responses:
        '200':
          description: 订阅
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: '#/components/schemas/SubscriptionItem' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/admin/membership/compensate:
    post:
      tags: [Admin-会员]
      summary: 补偿发放会员（membership.write）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, planId, reason]
              properties:
                userId: { type: string, format: uuid }
                planId: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: 订阅
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: '#/components/schemas/SubscriptionItem' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/admin/membership/subscriptions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Admin-会员]
      summary: 作废订阅（membership.write；作废后立即失去付费身份并同步配额）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 已作废
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [ended] }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409', description: 已作废不能重复作废 }
  /api/admin/sso/clients:
    get:
      tags: [Admin-SSO]
      summary: OAuth 客户端列表（sso.read）
      responses:
        '200':
          description: 客户端列表（永不回传密钥）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SsoClientItem' } }
                  total: { type: integer }
                  page: { type: integer }
                  size: { type: integer }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Admin-SSO]
      summary: 新增客户端（sso.write，明文密钥仅本次返回）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirectUris]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                redirectUris:
                  type: array
                  minItems: 1
                  items: { type: string }
                  description: 须 https（仅 localhost 允许 http）；不得带 fragment
                productId: { type: string, default: canvas }
      responses:
        '201':
          description: 客户端与一次性密钥
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: '#/components/schemas/SsoClientItem' }
                  clientSecret: { type: string, description: 48 位 hex 明文，仅此一次 }
        '400': { $ref: '#/components/responses/Error400' }
  /api/admin/sso/clients/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Admin-SSO]
      summary: 编辑客户端（sso.write，至少一项字段）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                redirectUris: { type: array, items: { type: string } }
                enabled: { type: boolean }
      responses:
        '200':
          description: 客户端
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: '#/components/schemas/SsoClientItem' }
        '404': { $ref: '#/components/responses/Error404' }
    delete:
      tags: [Admin-SSO]
      summary: 删除客户端（sso.write，授权即刻失效）
      responses:
        '204': { description: 已删除 }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/sso/clients/{id}/reset-secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin-SSO]
      summary: 重置客户端密钥（sso.write，旧密钥立即失效）
      responses:
        '200':
          description: 新明文密钥（仅此一次）
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret: { type: string }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/moderation/records:
    get:
      tags: [Admin-审核]
      summary: 审核记录筛选（moderation.read）
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/SizeParam' }
        - { name: stage, in: query, schema: { type: string, enum: [upload, artifact] } }
        - { name: decision, in: query, schema: { type: string, enum: [passed, rejected, error] } }
        - { name: reviewStatus, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: label, in: query, schema: { type: string }, description: 风险标签包含匹配 }
        - { name: sort, in: query, schema: { type: string }, description: '白名单 createdAt|decision，默认 -createdAt' }
      responses:
        '200':
          description: 审核记录分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ModerationRecord' } }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  size: { type: integer }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/moderation/records/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Admin-审核]
      summary: 审核详情（moderation.read，附隔离原件预览信息）
      responses:
        '200':
          description: 记录详情与隔离状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  record:
                    allOf:
                      - $ref: '#/components/schemas/ModerationRecord'
                      - type: object
                        properties:
                          providerResult: { type: object, additionalProperties: true }
                  quarantine:
                    type: object
                    properties:
                      available: { type: boolean }
                      previewPath: { type: string }
                      expiresAt: { type: string }
                      reason: { type: string, description: 不可用时给出原因 }
        '404': { $ref: '#/components/responses/Error404' }
    patch:
      tags: [Admin-审核]
      summary: 人工改判（moderation.review，revision 乐观锁；approved 释放隔离原件）
      description: 生成件释放时按物主档位烧录水印（免费/日落档烧水印并留存干净原件，付费档落原始字节）；失败 fail-closed 保留隔离原件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note, revision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                note: { type: string }
                revision: { type: integer, description: 须等于当前 reviewRevision }
      responses:
        '200':
          description: 改判结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: { type: boolean }
                  releaseError: { type: string }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409', description: MODERATION_ALREADY_REVIEWED }
  /api/admin/moderation/records/{id}/preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Admin-审核]
      summary: 隔离原件预览（moderation.read，二进制流）
      responses:
        '200':
          description: 原件字节（application/octet-stream，no-store）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/moderation/records/{id}/compensate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin-审核]
      summary: 误判补偿点数（moderation.compensate，同一记录仅一次，只进赠送桶）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMicros, note]
              properties:
                amountMicros: { type: integer, format: int64, minimum: 1 }
                note: { type: string }
      responses:
        '200':
          description: 补偿后余额
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchasedMicros: { type: integer, format: int64 }
                  grantedMicros: { type: integer, format: int64 }
        '402': { $ref: '#/components/responses/Error402' }
        '409': { $ref: '#/components/responses/Error409', description: 已补偿 }
  /api/admin/moderation/stats:
    get:
      tags: [Admin-审核]
      summary: 审核统计（moderation.read：命中率/失败率/标签分布/复核积压/隔离区用量）
      responses:
        '200':
          description: 统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationStats' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/community/works:
    get:
      tags: [Admin-社区]
      summary: 作品管理列表（community.read，含未发布/已下架）
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/SizeParam' }
        - { name: status, in: query, schema: { type: string, enum: [published, hidden, removed] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 作品分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminWorkItem' } }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  size: { type: integer }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/community/works/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Admin-社区]
      summary: 下架/恢复作品（community.write）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [published, hidden, removed] }
      responses:
        '200':
          description: 已变更
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/community/reports:
    get:
      tags: [Admin-社区]
      summary: 举报列表（community.read）
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/SizeParam' }
        - { name: status, in: query, schema: { type: string, enum: [pending, handled, dismissed] } }
      responses:
        '200':
          description: 举报分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReportItem' } }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  size: { type: integer }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/community/reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Admin-社区]
      summary: 处理举报（community.write；handled+removeWork 同时下架作品）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [handled, dismissed] }
                removeWork: { type: boolean }
      responses:
        '200':
          description: 已处理
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/settings:
    get:
      tags: [Admin-设置]
      summary: 站点设置快照（settings.read）
      responses:
        '200':
          description: 设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteSettings' }
        '403': { $ref: '#/components/responses/Error403' }
    patch:
      tags: [Admin-设置]
      summary: 批量更新站点设置（settings.write，整单写一条审计）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                announcement: { type: string }
                registrationEnabled: { type: boolean }
                maintenanceMode: { type: boolean }
                maintenanceNotice: { type: string }
                communityEnabled: { type: boolean }
                checkinEnabled: { type: boolean }
                checkinRewardMicros: { type: integer, format: int64, minimum: 0 }
                inviteEnabled: { type: boolean }
                inviteRewardMicros: { type: integer, format: int64, minimum: 0 }
                inviteeRewardMicros: { type: integer, format: int64, minimum: 0 }
                maxUploadBytes: { type: integer, format: int64 }
                generationConcurrency: { type: integer, format: int64 }
      responses:
        '200':
          description: 更新后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteSettings' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/admin/admins:
    get:
      tags: [Admin-角色与权限]
      summary: 管理员列表（roles.read）
      responses:
        '200':
          description: 管理员列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminListItem' } }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Admin-角色与权限]
      summary: 提升已有用户为管理员（roles.manage，变更后撤销其全部会话）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: 已提升
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  role: { type: string }
                  roleKey: { type: string }
        '400': { $ref: '#/components/responses/Error400' }
        '409': { $ref: '#/components/responses/Error409', description: 已是管理员 }
  /api/admin/admins/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Admin-角色与权限]
      summary: 撤销管理员权限（roles.manage；不能撤销自己，须保留至少一个 active 管理员）
      responses:
        '204': { description: 已撤销 }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/roles:
    get:
      tags: [Admin-角色与权限]
      summary: 角色列表（roles.read，含成员数与已分配权限）
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RoleItem' } }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Admin-角色与权限]
      summary: 新建角色（roles.manage）
      description: key 规则 ^[a-z][a-z0-9._-]{1,63}$，不得为 admin 或 admin. 前缀。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key: { type: string }
                name: { type: string, minLength: 1, maxLength: 64 }
                description: { type: string, maxLength: 200 }
      responses:
        '201':
          description: 角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleItem' }
        '400': { $ref: '#/components/responses/Error400' }
  /api/admin/roles/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Admin-角色与权限]
      summary: 编辑角色（roles.manage；系统角色权限不可编辑，权限为全量替换）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64 }
                description: { type: string, maxLength: 200 }
                permissions: { type: array, items: { type: string } }
      responses:
        '200':
          description: 角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleItem' }
        '404': { $ref: '#/components/responses/Error404' }
    delete:
      tags: [Admin-角色与权限]
      summary: 删除角色（roles.manage；系统角色、仍有成员的角色不可删）
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/permissions:
    get:
      tags: [Admin-角色与权限]
      summary: 权限点目录（roles.read，按模块分组，只读）
      responses:
        '200':
          description: 权限目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PermissionModuleItem' } }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/audit-logs:
    get:
      tags: [Admin-审计]
      summary: 管理操作审计日志（audit.read，created_at 倒序分页）
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/SizeParam' }
        - { name: action, in: query, schema: { type: string }, description: 精确匹配 }
        - { name: targetType, in: query, schema: { type: string }, description: 精确匹配 }
      responses:
        '200':
          description: 审计分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditLogItem' } }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  size: { type: integer }
        '403': { $ref: '#/components/responses/Error403' }
