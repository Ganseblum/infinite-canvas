# 顶层项目名：跳过 deploy.sh 直接执行 docker compose 时的兜底隔离；
# deploy.sh 的 -p 参数与 env 文件里的 COMPOSE_PROJECT_NAME 会覆盖它。
name: ${COMPOSE_PROJECT_NAME:-infinite-canvas}

services:
  app:
    # 镜像 tag 按环境区分（测试 :test / 正式 :prod，由 env 文件提供），
    # 避免测试构建覆盖正式正在用的镜像；本 Fork 的 web 必须自建镜像，不使用上游 ghcr 镜像。
    image: ${APP_IMAGE:?需要在 env 文件里设置 APP_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    # 端口只绑回环，公网访问一律走宿主机 nginx 反代 443；对外端口由 env 文件的 APP_PORT 指定。
    ports:
      - "127.0.0.1:${APP_PORT:?需要在 env 文件里设置 APP_PORT}:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # SITE_ENV=production 之外的值（如 test）会在页面顶栏显示环境标识，避免在测试站上误操作。
    # API_BASE_URL 留空表示前端与 /api 同源，由容器内 nginx 反代；只有前后端分开部署时才填。
    # 统计分析（可选，默认关闭）。每家一个独立变量，填了谁就启用谁，可同时启用多家：
    environment:
      SITE_ENV: "${SITE_ENV:-production}"
      API_BASE_URL: "${API_BASE_URL:-}"
      # 管理后台的对外域名：主站用户菜单的后台入口用它拼绝对地址，留空则整个入口隐藏。
      # 与下面 admin 服务的 API_BASE_URL（指向主站 API）不是一回事，别混。
      ADMIN_BASE_URL: "${ADMIN_BASE_URL:-}"
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX                    # Google Analytics 4 衡量 ID
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx   # 百度统计站点 ID

  admin:
    # 管理后台是独立静态站点，自建镜像，tag 同样按环境区分（测试 :test / 正式 :prod）。
    image: ${ADMIN_IMAGE:?需要在 env 文件里设置 ADMIN_IMAGE}
    # 构建上下文必须是仓库根：admin 复用 web/src 的外壳模块（见 admin/scripts/web-whitelist.mjs），
    # 不要改成 context: ./admin，别名目标与 CSS 依赖都会找不到。
    build:
      context: .
      dockerfile: admin/Dockerfile
    # 端口只绑回环，公网访问一律走宿主机 nginx 反代 443；对外端口由 env 文件的 ADMIN_PORT 指定。
    ports:
      - "127.0.0.1:${ADMIN_PORT:?需要在 env 文件里设置 ADMIN_PORT}:3000"
    restart: unless-stopped
    # 刻意不写 depends_on: api：admin 是纯静态、容器内没有 upstream，跨域直连主站 API，
    # 加上依赖只会让 api 重建时多等一轮，拖慢回滚。
    environment:
      # 容器内的键名是 API_BASE_URL（admin 与主站共用同一份运行期配置读取代码），值取自 ADMIN_API_BASE_URL。
      # 必须是非空绝对地址：admin 域上没有 /api，留空会让请求全打到 admin 自己身上变 404；入口脚本也会拒绝启动。
      # 注意别把它和上面 app 服务的 API_BASE_URL 混了：那是主站的，同源部署时为空。
      API_BASE_URL: "${ADMIN_API_BASE_URL:?需要在 env 文件里设置 ADMIN_API_BASE_URL}"
      # 后台自己的对外域名：页面里指向主站的绝对链接用它拼（留空时降级为纯文本）。
      ADMIN_BASE_URL: "${ADMIN_BASE_URL:-}"
      SITE_ENV: "${SITE_ENV:-production}"

  api:
    # tag 与 app 一样按环境区分，防止测试构建污染正式镜像
    image: ${API_IMAGE:?需要在 env 文件里设置 API_IMAGE}
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      # 跨源白名单：admin 独立域名启用后，管理后台会跨源直连本 API。
      # 留空 = 完全关闭 CORS，行为与拆分前一致；改这里必须重建 api 容器才生效。
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-true}"
      # 测试数据开关：只在测试/预发布环境开启，正式环境保持 false
      SEED_TEST_DATA: "${SEED_TEST_DATA:-false}"
      SEED_TEST_DATA_EMAIL: "${SEED_TEST_DATA_EMAIL:-test@example.com}"
      SEED_TEST_DATA_PASSWORD: "${SEED_TEST_DATA_PASSWORD:-test123456}"
      FREE_GRANT_ENABLED: "${FREE_GRANT_ENABLED:-true}"
      # 启用赠送时以下三项必填且大于 0，无默认值；缺失会导致 api 启动失败
      FREE_GRANT_CAMPAIGN_ID: ${FREE_GRANT_CAMPAIGN_ID}
      FREE_GRANT_DAILY_BUDGET_MICROS: "${FREE_GRANT_DAILY_BUDGET_MICROS}"
      FREE_GRANT_RISK_THRESHOLD: "${FREE_GRANT_RISK_THRESHOLD}"
      # 点数与支付：ENTITLEMENT_DAYS 缺省 30；限时折扣总开关缺省开启
      ENTITLEMENT_DAYS: "${ENTITLEMENT_DAYS:-30}"
      PRICING_PROMOTION_ENABLED: "${PRICING_PROMOTION_ENABLED:-true}"
      # 支付回调地址缺省由 APP_BASE_URL 推导；渠道未配置时自动不上架，配了就必须完整
      PAYMENT_NOTIFY_URL: ${PAYMENT_NOTIFY_URL:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-}
      ALIPAY_PRODUCTION: "${ALIPAY_PRODUCTION:-false}"
      WECHATPAY_APP_ID: ${WECHATPAY_APP_ID:-}
      WECHATPAY_MCH_ID: ${WECHATPAY_MCH_ID:-}
      WECHATPAY_MCH_SERIAL_NO: ${WECHATPAY_MCH_SERIAL_NO:-}
      WECHATPAY_MCH_PRIVATE_KEY: ${WECHATPAY_MCH_PRIVATE_KEY:-}
      WECHATPAY_API_V3_KEY: ${WECHATPAY_API_V3_KEY:-}
      # AI 转发超时与内网上游开关（仅本地调试开启）
      AI_IMAGE_TIMEOUT: "${AI_IMAGE_TIMEOUT:-180s}"
      AI_AUDIO_TIMEOUT: "${AI_AUDIO_TIMEOUT:-120s}"
      AI_STREAM_TIMEOUT: "${AI_STREAM_TIMEOUT:-600s}"
      AI_STREAM_IDLE_TIMEOUT: "${AI_STREAM_IDLE_TIMEOUT:-60s}"
      AI_VIDEO_TASK_TIMEOUT: "${AI_VIDEO_TASK_TIMEOUT:-20m}"
      AI_ALLOW_PRIVATE_UPSTREAM: "${AI_ALLOW_PRIVATE_UPSTREAM:-false}"
      # 内容审核（第五期）：开启时 MODERATION_FAIL_MODE 必填
      MODERATION_ENABLED: "${MODERATION_ENABLED:-false}"
      MODERATION_PROVIDER: "${MODERATION_PROVIDER:-fake}"
      # 仅 fake provider 生效：命中即触发拒绝的文本片段，逗号分隔，供 fake 拒绝链路联调
      MODERATION_FAKE_REJECT_TEXTS: "${MODERATION_FAKE_REJECT_TEXTS:-}"
      MODERATION_NSFWJS_ENDPOINT: "${MODERATION_NSFWJS_ENDPOINT:-}"
      MODERATION_DETOXIFY_ENDPOINT: "${MODERATION_DETOXIFY_ENDPOINT:-}"
      MODERATION_IMAGE_THRESHOLD: "${MODERATION_IMAGE_THRESHOLD:-0.6}"
      MODERATION_TEXT_THRESHOLD: "${MODERATION_TEXT_THRESHOLD:-0.8}"
      MODERATION_VIDEO_SAMPLE_FPS: "${MODERATION_VIDEO_SAMPLE_FPS:-1}"
      MODERATION_FAIL_MODE: ${MODERATION_FAIL_MODE:-}
      MODERATION_TIMEOUT: "${MODERATION_TIMEOUT:-5s}"
      MODERATION_POLICY_VERSION: "${MODERATION_POLICY_VERSION:-v1}"
      MODERATION_QUARANTINE_TTL: "${MODERATION_QUARANTINE_TTL:-24h}"
      MODERATION_CACHE_TTL: "${MODERATION_CACHE_TTL:-10m}"
      # 媒体存储：local 用 media 卷；s3 时以下变量必填，桶必须私有
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
      # S3_PRESIGN_TTL 必须等于 2 × S3_PRESIGN_ALIGN，不满足 api 启动失败
      S3_PRESIGN_ALIGN: ${S3_PRESIGN_ALIGN:-1h}
      S3_PRESIGN_TTL: ${S3_PRESIGN_TTL:-2h}
    # 绑挂载而非命名卷：数据落在仓库目录下的 ./data，备份与迁移就是打包一个目录，
    # 磁盘占用在宿主机上直接可见，也与服务器上既有项目的 ./data 约定一致。
    # 注意：api 容器以 uid 10001 运行，命名卷会自动继承镜像内 /data/media 的属主，
    # 绑挂载不会。首次部署前必须执行 chown -R 10001:10001 ./data/media，否则媒体写入失败。
    volumes:
      - ./data/media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  db:
    # 8.4 是 MySQL 当前 LTS（支持到 2032；8.0 已过首选支持期，9.x 为短周期 innovation 版）。
    # 钉死补丁号，保证测试与正式两套环境跑的是同一个版本，升级靠手动改这一行。
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ===== 内容审核推理 sidecar（可选，默认不启动）=====
  # image 为占位：按《我的规划/后续功能备忘》的 sidecar 契约实现真实镜像后填入再启用
  # （NSFWJS: POST /classify {mimeType, data(base64)} → predictions[]；Detoxify: POST /classify {text} → scores{}）。
  # 启用方式见 deploy/README.md「内容审核」一节：docker compose --profile moderation up -d，
  # 并把 MODERATION_PROVIDER 切到 nsfwjs+detoxify，ENDPOINT 填下方两个服务名地址。
  # 两个 sidecar 只在 compose 内网互相可达（expose 不映射宿主机端口），api 通过服务名访问。
  nsfwjs:
    image: nsfwjs-sidecar:placeholder # 占位镜像，实现真实 sidecar 前勿启用本 profile
    profiles: ["moderation"]
    expose:
      - "8080"
    restart: unless-stopped

  detoxify:
    image: detoxify-sidecar:placeholder # 占位镜像，实现真实 sidecar 前勿启用本 profile
    profiles: ["moderation"]
    expose:
      - "8000"
    restart: unless-stopped
