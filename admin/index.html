<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="优刻管理后台" />
        <!-- 管理后台不参与搜索收录。 -->
        <meta name="robots" content="noindex" />
        <link rel="icon" href="/favicon.svg" />
        <title>管理后台 · 优刻</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <!-- 运行期配置：容器入口脚本生成，必须早于应用模块加载，否则 API_BASE_URL 为空、
         请求会打到 admin 域自己（静态服务对 POST 返回 405）。 -->
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
