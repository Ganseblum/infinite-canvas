server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 这里是纯静态站点，刻意没有任何 /api 反代：admin 跨域直连主站 API（ADMIN_API_BASE_URL），
    # 所以既没有 SSE，也没有大体积媒体上传，不需要 web 那份按接口放宽的超时与体积上限。

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后重建容器即时生效；
    # 少了这条，「改了 env 没生效」会再浪费一整轮排查。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
