<script>
  function toggleTheme() {
    const dark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }
  /* ===== Toast 基础设施（带语义图标） ===== */
  const toastEl = document.createElement('div');
  toastEl.className = 'toast hidden-t';
  document.body.appendChild(toastEl);
  const infraStyle = document.createElement('style');
  infraStyle.textContent = `
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modal-in { from { opacity: 0; transform: scale(0.96) translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes drawer-in { from { transform: translateX(100%); } to { transform: none; } }
    .overlay-open { animation: fade-in 0.2s ease-out; }
    .modal-open { animation: modal-in 0.25s cubic-bezier(0.16,1,0.3,1); }
    .drawer-open { animation: drawer-in 0.3s cubic-bezier(0.16,1,0.3,1); }
    .toast { position: fixed; left: 50%; top: 4.5rem; z-index: 70; display: flex; align-items: center; gap: 0.625rem; border-radius: 0.5rem; border: 1px solid rgb(231 229 228); background: #fff; padding: 0.625rem 1rem; font-size: 0.875rem; box-shadow: 0 10px 30px rgba(0,0,0,0.12); transition: all .3s; }
    .dark .toast { border-color: rgba(255,255,255,0.14); background: #292524; }
    .hidden-t { transform: translate(-50%, -8px); opacity: 0; pointer-events: none; }
  `;
  document.head.appendChild(infraStyle);
  const toastIcons = { success: 'check-circle-2', error: 'alert-circle', info: 'info' };
  let toastTimer;
  function toast(msg, type = 'info') {
    const color = type === 'error' ? 'text-red-600 dark:text-red-400' : type === 'success' ? 'text-emerald-600 dark:text-emerald-400' : 'text-stone-500 dark:text-stone-400';
    toastEl.innerHTML = `<i data-lucide="${toastIcons[type]}" class="size-4 shrink-0 ${color}"></i><span>${msg}</span>`;
    toastEl.classList.remove('hidden-t');
    lucide.createIcons();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.add('hidden-t'), 2500);
  }
  function openModal(id) {
    const el = document.getElementById(id);
    el.classList.remove('hidden');
    const card = el.querySelector('.drawer-open, .modal-open');
    if (card) { card.style.animation = 'none'; void card.offsetWidth; card.style.animation = ''; }
  }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  function toggleDrawer(open) {
    const d = document.getElementById('drawer');
    if (d) d.classList.toggle('hidden', !open);
  }

  function toggleDrawer(open) {
    document.getElementById('drawer').classList.toggle('hidden', !open);
  }
  document.querySelectorAll('#kind .filter-tag').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#kind .filter-tag').forEach((el) => el.classList.toggle('active', el === btn));
    });
  });

  /* ===== Mock：素材删除 / 批量 ===== */
  function removeAsset(icon) {
    const card = icon.closest('.card');
    if (card) { card.style.transition = 'opacity .3s, transform .3s'; card.style.opacity = '0'; card.style.transform = 'scale(0.95)'; setTimeout(() => card.remove(), 300); }
    toast('素材已删除', 'success');
  }
  function batchDownload() {
    const n = document.querySelectorAll('.row-check:checked, #grid input[type="checkbox"]:checked').length;
    toast(n ? `正在打包 ${n} 个素材…（Mock）` : '请先勾选素材', n ? 'info' : 'error');
  }
  function batchDelete() {
    const checked = [...document.querySelectorAll('#grid input[type="checkbox"]')].filter((c) => c.checked);
    if (!checked.length) { toast('请先勾选素材', 'error'); return; }
    checked.forEach((c) => { const card = c.closest('.card'); if (card) { card.style.opacity = '0'; card.style.transform = 'scale(0.95)'; setTimeout(() => card.remove(), 300); } });
    toast(`已删除 ${checked.length} 个素材`, 'success');
  }

  /* 批量模式切换 */
  function toggleBatch(on) {
    document.getElementById('batch-bar').classList.toggle('hidden', !on);
    document.getElementById('batch-bar').classList.toggle('flex', on);
    document.getElementById('batch-btn').classList.toggle('hidden', on);
    document.querySelectorAll('#grid .check').forEach((el) => el.classList.toggle('hidden', !on));
  }
  /* 卡片选中 */
  function togglePick(card) {
    if (!document.getElementById('batch-bar').classList.contains('hidden')) {
      const cb = card.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
      card.classList.toggle('!border-stone-900', cb.checked);
      card.classList.toggle('dark:!border-stone-100', cb.checked);
    }
  }
  lucide.createIcons();
</script>
</body>
</html>
