<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>无限画布 · 注册设计稿</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<script>
  if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
  .btn-primary { @apply inline-flex h-10 items-center justify-center gap-2 rounded-lg bg-stone-900 px-5 text-sm font-medium text-white transition hover:bg-stone-900/85 active:bg-stone-900/75 active:scale-[0.98] disabled:pointer-events-none disabled:opacity-40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-stone-900 dark:bg-stone-100 dark:text-stone-900 dark:hover:bg-stone-100/85 dark:active:bg-stone-100/75 dark:focus-visible:outline-stone-100; }
  .btn-secondary { @apply inline-flex h-10 items-center justify-center gap-2 rounded-lg border border-stone-200 px-5 text-sm font-medium text-stone-700 transition hover:bg-black/[0.08] active:bg-black/[0.14] active:scale-[0.98] disabled:pointer-events-none disabled:opacity-40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-stone-900 dark:border-stone-700 dark:text-stone-300 dark:hover:bg-white/[0.12] dark:active:bg-white/[0.18] dark:focus-visible:outline-stone-100; }
  .icon-btn { @apply inline-flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-md text-stone-600 transition hover:bg-black/5 hover:text-stone-950 active:scale-95 active:bg-black/[0.1] disabled:pointer-events-none disabled:opacity-40 dark:text-stone-300 dark:hover:bg-white/10 dark:hover:text-white dark:active:bg-white/[0.2]; }
  .field-input { @apply h-11 w-full rounded-lg border border-stone-200 bg-transparent px-3 text-sm text-stone-900 outline-none transition placeholder:text-stone-400 focus:border-stone-400 dark:border-stone-700 dark:text-stone-100 dark:focus:border-stone-500; }
  .field-label { @apply mb-1.5 block text-sm text-stone-600 dark:text-stone-300; }
  .dot-grid { background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 16px 16px; }
  .dark .dot-grid { background-image: radial-gradient(rgba(245,245,244,.18) 1px, transparent 1px); }
  .ai-title-aurora {
    background: linear-gradient(90deg, #111827 0%, #111827 36%, #6b7280 54%, #111827 72%, #111827 100%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: ai-title-aurora 7s ease-in-out infinite;
  }
  .dark .ai-title-aurora {
    background: linear-gradient(90deg, #fafaf9 0%, #fafaf9 36%, #a8a29e 54%, #fafaf9 72%, #fafaf9 100%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text;
  }
  @keyframes ai-title-aurora {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
</style>
</head>
<body class="bg-white text-stone-950 antialiased dark:bg-[#1c1917] dark:text-stone-100">

<div class="flex h-dvh">
  <!-- ========== 左侧品牌区（lg 以上显示） ========== -->
  <aside class="dot-grid relative hidden w-[44%] max-w-2xl flex-col justify-between overflow-hidden border-r border-stone-200 p-10 lg:flex dark:border-stone-800">
    <div class="pointer-events-none absolute right-[18%] top-[22%] size-24 rounded-full border border-dashed border-stone-200 dark:border-stone-800"></div>
    <a href="home.html" class="relative flex items-center gap-2 text-sm font-semibold tracking-tight">
      <span class="size-5 rounded bg-current"></span>
      <span class="text-base font-medium">无限画布</span>
    </a>
    <div class="relative">
      <h1 class="ai-title-aurora text-4xl font-semibold leading-tight xl:text-5xl">注册即送体验积分，<br />几分钟内出第一张图。</h1>
      <p class="mt-5 max-w-md text-sm leading-7 text-stone-500 dark:text-stone-400">无需绑定支付方式。免费版每月赠送积分，可随时升级到专业版解锁更多模型与并发。</p>
      <div class="mt-8 flex items-center gap-4 text-sm text-stone-600 dark:text-stone-300">
        <span class="flex items-center gap-2"><i data-lucide="zap" class="size-4"></i>每月免费积分</span>
        <span class="flex items-center gap-2"><i data-lucide="cloud" class="size-4"></i>云端项目同步</span>
        <span class="flex items-center gap-2"><i data-lucide="users" class="size-4"></i>社区发布</span>
      </div>
    </div>
    <p class="relative text-xs text-stone-400 dark:text-stone-500">© 2026 无限画布</p>
  </aside>

  <!-- ========== 右侧表单区 ========== -->
  <main class="relative flex min-w-0 flex-1 items-center justify-center overflow-y-auto p-6">
    <button type="button" class="icon-btn absolute right-4 top-4" onclick="toggleTheme()" title="切换主题">
      <i data-lucide="sun" class="size-4 hidden dark:block"></i>
      <i data-lucide="moon" class="size-4 dark:hidden"></i>
    </button>

    <div class="w-full max-w-sm py-8">
      <!-- 移动端 Logo -->
      <a href="home.html" class="mb-8 flex items-center justify-center gap-2 lg:hidden">
        <span class="size-5 rounded bg-current"></span>
        <span class="text-base font-medium">无限画布</span>
      </a>

      <h2 class="text-2xl font-semibold">创建账号</h2>
      <p class="mt-2 text-sm text-stone-500 dark:text-stone-400">已有账号？<a href="login.html" class="font-medium text-stone-900 underline-offset-4 hover:underline dark:text-stone-100">直接登录</a></p>

      <form class="mt-8 space-y-4" onsubmit="return false;">
        <div>
          <label class="field-label" for="nickname">昵称</label>
          <input id="nickname" type="text" class="field-input" placeholder="给自己起个名字" />
        </div>
        <div>
          <label class="field-label" for="email">邮箱</label>
          <input id="email" type="email" class="field-input" placeholder="you@example.com" />
        </div>
        <div>
          <label class="field-label" for="code">邮箱验证码</label>
          <div class="flex gap-2">
            <input id="code" type="text" class="field-input flex-1" placeholder="6 位验证码" maxlength="6" />
            <button type="button" class="btn-secondary shrink-0 !px-3 text-[13px]" onclick="sendCode(this)">发送验证码</button>
          </div>
        </div>
        <div>
          <label class="field-label" for="password">设置密码</label>
          <input id="password" type="password" class="field-input" placeholder="至少 8 位，含字母与数字" />
        </div>
        <div>
          <label class="field-label" for="confirm">确认密码</label>
          <input id="confirm" type="password" class="field-input" placeholder="再次输入密码" />
        </div>

        <label class="flex cursor-pointer items-start gap-2.5 text-xs leading-5 text-stone-500 dark:text-stone-400">
          <input type="checkbox" class="mt-0.5 size-3.5 accent-stone-900 dark:accent-stone-100" />
          <span>我已阅读并同意
            <a href="#" class="underline underline-offset-2">服务条款</a>
            与
            <a href="#" class="underline underline-offset-2">隐私政策</a>
          </span>
        </label>

        <button type="submit" class="btn-primary w-full" onclick="doRegister()">注 册</button>
      </form>

      <div class="mt-8">
        <div class="flex items-center gap-4 text-xs text-stone-400 dark:text-stone-500">
          <span class="h-px flex-1 bg-stone-200 dark:bg-stone-800"></span>
          其他注册方式
          <span class="h-px flex-1 bg-stone-200 dark:bg-stone-800"></span>
        </div>
        <div class="mt-4 flex justify-center gap-3">
          <button type="button" class="btn-secondary !h-10 !px-5" title="GitHub 注册" onclick="oauth('GitHub')"><i data-lucide="github" class="size-4"></i>GitHub</button>
          <button type="button" class="btn-secondary !h-10 !px-5" title="Google 注册" onclick="oauth('Google')"><i data-lucide="chrome" class="size-4"></i>Google</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  function toggleTheme() {
    const dark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }
  function sendCode(btn) {
    let left = 60;
    btn.disabled = true;
    const timer = setInterval(() => {
      btn.textContent = `${left--}s 后重发`;
      if (left < 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '发送验证码'; }
    }, 1000);
  }

  /* ===== Mock：注册校验与跳转 ===== */
  function needToast(msg, type) { toast(msg, type); return false; }
  function doRegister() {
    const nick = document.getElementById('nickname').value.trim();
    const email = document.getElementById('email').value.trim();
    const code = document.getElementById('code').value.trim();
    const pw = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const agree = document.querySelector('input[type="checkbox"]').checked;
    if (!nick) return needToast('请输入昵称', 'error');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return needToast('请输入有效的邮箱地址', 'error');
    if (!/^\d{6}$/.test(code)) return needToast('请输入 6 位邮箱验证码', 'error');
    if (pw.length < 8 || !/[a-zA-Z]/.test(pw) || !/\d/.test(pw)) return needToast('密码至少 8 位，需含字母与数字', 'error');
    if (pw !== confirm) return needToast('两次输入的密码不一致', 'error');
    if (!agree) return needToast('请先阅读并同意服务条款与隐私政策', 'error');
    toast('注册成功，赠送积分已到账，正在进入…', 'success');
    setTimeout(() => location.href = 'account.html', 900);
  }
  function oauth(name) {
    toast(`${name} 授权中…（Mock）`, 'info');
    setTimeout(() => location.href = 'account.html', 900);
  }


  /* ===== Toast（带语义图标） ===== */
  const toastEl = document.createElement('div');
  toastEl.className = 'toast hidden-t';
  document.body.appendChild(toastEl);
  const style2 = document.createElement('style');
  style2.textContent = `
    .toast { position: fixed; left: 50%; top: 4.5rem; z-index: 70; display: flex; align-items: center; gap: 0.625rem; border-radius: 0.5rem; border: 1px solid rgb(231 229 228); background: #fff; padding: 0.625rem 1rem; font-size: 0.875rem; box-shadow: 0 10px 30px rgba(0,0,0,0.12); transition: all .3s; }
    .dark .toast { border-color: rgba(255,255,255,0.14); background: #292524; }
    .hidden-t { transform: translate(-50%, -8px); opacity: 0; pointer-events: none; }
  `;
  document.head.appendChild(style2);
  const toastIcons = { success: 'check-circle-2', error: 'alert-circle', info: 'info' };
  let toastTimer;
  function toast(msg, type = 'info') {
    const color = type === 'error' ? 'text-red-600 dark:text-red-400' : type === 'success' ? 'text-emerald-600 dark:text-emerald-400' : 'text-stone-500 dark:text-stone-400';
    toastEl.innerHTML = `<i data-lucide="${toastIcons[type]}" class="size-4 shrink-0 ${color}"></i><span>${msg}</span>`;
    toastEl.classList.remove('hidden-t');
    lucide.createIcons();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.add('hidden-t'), 2500);
  }

  lucide.createIcons();
</script>
</body>
</html>
