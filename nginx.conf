server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # AI 转发与 SSE 必须关闭缓冲并放宽超时，且要放在 /api/ 之前。
    # proxy_pass 同样不能带 URI 部分，路径原样透传才能对上后端的 /api/ai/*。
    location /api/ai/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # 后端 API 反代。proxy_pass 不能带尾斜杠，否则会剥掉 /api 前缀导致全线 404。
    # 媒体接口单独放开体积上限，其余接口限 2m，避免画布 JSON 撑大数据库。
    location /api/media/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    # 不用 $uri/：dist 里有真实的 assets/ 目录，路由 /assets 会被当成目录
    # 触发 301 绝对重定向并把容器内部端口 3000 带进 Location（外网不可达）。
    location / {
        try_files $uri /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
